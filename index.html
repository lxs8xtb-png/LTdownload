<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LT</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  font-family:Arial,sans-serif; background:#0b0d12; color:#fff;
}
.card{
  width:min(460px,calc(100% - 32px)); padding:36px;
  text-align:center; background:#12151c;
  border:1px solid #292e3a; border-radius:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.45);
}
h1{margin:0 0 8px;font-size:38px}
p{margin:0 0 28px;color:#aeb5c2}
.buttons{display:grid;gap:12px}
a{
  display:block;padding:15px 18px;border-radius:12px;
  text-decoration:none;font-weight:700;transition:.15s;
}
a:hover{transform:translateY(-2px)}
.site{background:#fff;color:#0b0d12}
.download{background:#242a35;color:#fff;border:1px solid #343b49}
small{display:block;margin-top:20px;color:#707887}
</style>
</head>
<body>
<main class="card">
  <h1>LT</h1>
  <p>Accède au site ou télécharge LT.</p>

  <div class="buttons">
    <!-- REMPLACE TON_URL_ICI par l'URL de ton autre site -->
    <a class="site" href="https://openlua.cloud" target="_blank" rel="noopener">
      🌐 Accéder au site
    </a>

    <!-- Le fichier lt.exe doit être dans le même dossier que cette page -->
    <a class="download" href="./lt.exe" download="lt.exe">
      📥 Télécharger lt.exe
    </a>
  </div>

  <small>lt.exe</small>
</main>
</body>
</html>
